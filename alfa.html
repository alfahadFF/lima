<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>الفا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#faf0e8">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="شي ان ليمار">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap bar"><span class="brand">الفا</span><a class="cartlink" href="index.html">المتجر</a></div></header>
<main class="wrap" style="padding-bottom:60px">

  <section id="login" class="panel" hidden style="max-width:420px;margin-inline:auto">
    <form id="lf">
      <div class="field"><label for="em">البريد</label><input class="in" id="em" type="email" autocomplete="username" required></div>
      <div class="field"><label for="pw">كلمة المرور</label><input class="in" id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn block" type="submit">دخول</button>
    </form>
  </section>

  <section id="app" hidden>
    <nav class="tabs">
      <button class="chip" data-tab="products" aria-pressed="true">المنتجات</button>
      <button class="chip" data-tab="form" aria-pressed="false" id="tabform">منتج جديد</button>
      <button class="chip" data-tab="cats" aria-pressed="false">الفئات</button>
      <button class="chip" id="out">خروج</button>
    </nav>

    <div id="t-products">
      <div class="tools"><input class="in" id="q" type="search" placeholder="ابحث بالكود أو الاسم" aria-label="بحث"></div>
      <div id="plist"></div>
    </div>

    <div id="t-form" class="panel" hidden>
      <h2 class="h1" id="ftitle" style="margin-top:0">منتج جديد</h2>
      <details class="import" open>
        <summary>استيراد منتج — الصق أي شيء هنا</summary>
        <div class="field" style="margin-top:12px">
          <textarea class="in" id="one" rows="4" placeholder="الصق رابط المنتج… أو (الأفضل) افتح المنتج وانسخ كل النص والصقه هنا"></textarea>
        </div>
        <button class="btn sm" id="one-go" type="button">استخراج وتعبئة</button>
        <p class="muted" id="one-msg" style="min-height:1.4em;margin:10px 0 0"></p>
        <div id="imp-prev"></div>
        <p id="one-open" hidden style="margin:10px 0 0"></p>

        <details style="margin-top:14px;border-top:1px dashed var(--line);padding-top:12px">
          <summary class="muted">طرق أخرى (زر السحب / JSON / كود الصفحة)</summary>
          <div class="field" style="margin-top:10px"><label for="pj">JSON من زر السحب</label><textarea class="in" id="pj" rows="3" dir="ltr" style="font-size:.82rem"></textarea></div>
          <button class="btn sm ghost" id="doimport" type="button">تعبئة من JSON</button>
          <div class="field" style="margin-top:12px"><label for="imp-html">كود الصفحة (HTML)</label><textarea class="in" id="imp-html" rows="3" dir="ltr" style="font-size:.82rem"></textarea></div>
          <button class="btn sm ghost" id="imp-parse" type="button">استخراج من الكود</button>
          <p class="muted" style="margin-top:10px"><a href="import.html" target="_blank" rel="noopener">شرح زر السحب ↗</a></p>
        </details>
      </details>

      <details class="import">
        <summary>بحث في مستودع CJ Dropshipping (اختياري)</summary>
        <div class="field" style="margin-top:12px"><input class="in" id="cjq" type="search" placeholder="ابحث بالإنجليزي، مثل: summer dress" dir="ltr"></div>
        <button class="btn sm" id="cjgo" type="button">بحث</button>
        <div id="cjres" style="margin-top:12px"></div>
        <p class="muted">هذا يبحث في مخزن CJ نفسه فقط — لا يجلب من شي إن/تيمو.</p>
      </details>

      <div class="field"><label for="f-title">اسم المنتج</label><input class="in" id="f-title"></div>
      <div class="field"><label for="f-url">رابط المصدر (أو كود cj:)</label><input class="in" id="f-url" type="url" dir="ltr"></div>
      <div class="two">
        <div class="field"><label for="f-price">سعر شي إن</label><input class="in" id="f-price" type="number" step="0.01" min="0" inputmode="decimal"></div>
        <div class="field"><label for="f-margin">الهامش %</label><input class="in" id="f-margin" type="number" step="0.5" min="0" inputmode="decimal" value="30"></div>
      </div>
      <div class="field"><label for="f-final">سعر البيع</label><input class="in" id="f-final" readonly></div>
      <div class="two">
        <div class="field"><label for="f-cat">الفئة</label><select class="in" id="f-cat"></select></div>
        <div class="field"><label for="f-status">الحالة</label>
          <select class="in" id="f-status"><option value="draft">مسودة</option><option value="published">منشور</option><option value="hidden">مخفي</option></select></div>
      </div>
      <div class="field"><label for="f-desc">الوصف</label><textarea class="in" id="f-desc"></textarea></div>
      <div class="field"><label for="f-images">روابط الصور (رابط بكل سطر، الأول هو الرئيسي)</label><textarea class="in" id="f-images" dir="ltr"></textarea></div>
      <div class="two">
        <div class="field"><label for="f-colors">الألوان (افصل بفاصلة)</label><input class="in" id="f-colors"></div>
        <div class="field"><label for="f-sizes">المقاسات (افصل بفاصلة)</label><input class="in" id="f-sizes"></div>
      </div>
      <button class="btn sm ghost" id="gen" type="button">توليد الخيارات</button>
      <div id="vlist" style="margin:12px 0 18px"></div>
      <div class="acts">
        <button class="btn" id="save" type="button">حفظ</button>
        <button class="btn ghost" id="cancel" type="button">إلغاء</button>
        <button class="btn bad" id="del" type="button" hidden>حذف المنتج</button>
      </div>
    </div>

    <div id="t-cats" class="panel" hidden>
      <div class="field"><label for="cname">فئة جديدة</label><input class="in" id="cname"></div>
      <button class="btn sm" id="addcat" type="button">إضافة</button>
      <div id="catlist" style="margin-top:14px"></div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="extract.js"></script>
<script>
const ST = { draft: 'مسودة', published: 'منشور', hidden: 'مخفي' };
let wasIn = false, cats = [], products = [], editing = null, variants = [];
const split = s => [...new Set(String(s || '').split(/[,،\n]+/).map(x => x.trim()).filter(Boolean))];

/* ---------- الدخول ---------- */
(async function () {
  if (!configReady()) { $('#login').hidden = false; $('#login').innerHTML = empty('أكمل مفاتيح Supabase في ملف config.js'); return; }
  const { data } = await sb.auth.getSession(); setAuth(data.session);
  sb.auth.onAuthStateChange((_e, s) => setAuth(s));
})();
function setAuth(s) {
  const inn = !!s;
  $('#login').hidden = inn; $('#app').hidden = !inn;
  if (inn && !wasIn) boot();
  wasIn = inn;
}
$('#lf').addEventListener('submit', async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
  if (error) toast('البريد أو كلمة المرور غير صحيحة');
});
$('#out').addEventListener('click', () => sb.auth.signOut());

async function boot() { await loadCats(); await loadProducts(); resetForm(); tab('products'); }
function tab(n) {
  ['products', 'form', 'cats'].forEach(t => {
    $('#t-' + t).hidden = t !== n;
    $(`[data-tab="${t}"]`).setAttribute('aria-pressed', t === n);
  });
}
$$('[data-tab]').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.tab === 'form' && !editing) resetForm();
  tab(b.dataset.tab);
}));

/* ---------- الفئات ---------- */
async function loadCats() {
  const { data, error } = await sb.from('categories').select('*').order('sort_order').order('name');
  if (error) return toast(error.message);
  cats = data;
  $('#f-cat').innerHTML = '<option value="">بدون فئة</option>' + cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#catlist').innerHTML = cats.map(c => `<div class="crow"><span>${esc(c.name)}</span><button class="btn sm bad" data-delcat="${c.id}">حذف</button></div>`).join('') || empty('لا توجد فئات.');
}
$('#addcat').addEventListener('click', async () => {
  const name = $('#cname').value.trim(); if (!name) return;
  const { error } = await sb.from('categories').insert({ name, slug: 'c' + Date.now().toString(36), sort_order: cats.length });
  if (error) return toast(error.message);
  $('#cname').value = ''; await loadCats();
});
$('#catlist').addEventListener('click', async e => {
  const b = e.target.closest('[data-delcat]'); if (!b || !confirm('حذف الفئة؟ المنتجات تبقى بدون فئة.')) return;
  const { error } = await sb.from('categories').delete().eq('id', b.dataset.delcat);
  if (error) return toast(error.message);
  await loadCats();
});

/* ---------- قائمة المنتجات ---------- */
async function loadProducts() {
  const { data, error } = await sb.from('products')
    .select('id,code,title,status,final_price,shein_price,source_url,product_images(url,sort_order)')
    .order('created_at', { ascending: false });
  if (error) return toast(error.message);
  products = data; drawProducts();
}
function drawProducts() {
  const q = $('#q').value.trim().toLowerCase();
  const list = products.filter(p => !q || (p.code + ' ' + p.title).toLowerCase().includes(q));
  $('#plist').innerHTML = list.map(p => {
    const im = imgOf(p.product_images);
    return `<div class="prow">
      ${im ? img(im.url) : '<div class="noimg"></div>'}
      <div>
        <span class="tag">${esc(p.code)}</span> <b>${esc(p.title)}</b>
        <div class="muted"><span class="pill">${ST[p.status]}</span> شراء <bdi>${money(p.shein_price)}</bdi> / بيع <bdi>${money(p.final_price)}</bdi></div>
        ${p.source_url && !/^https?:/.test(p.source_url) ? `<div class="muted">المصدر: ${/^cj:/.test(p.source_url) ? 'CJ Dropshipping' : 'يدوي'} | SKU: <bdi dir="ltr">${esc(p.source_url.replace(/^cj:/, ''))}</bdi></div>` : ''}
        <div class="acts">
          <button class="btn sm ghost" data-edit="${p.id}">تعديل</button>
          <button class="btn sm ghost" data-toggle="${p.id}">${p.status === 'published' ? 'إخفاء' : 'نشر'}</button>
          ${p.source_url && !/^https?:/.test(p.source_url) ? `<button class="btn sm ghost" data-copy="${esc(p.source_url.replace(/^cj:/, ''))}">نسخ SKU</button>` : ''}
          ${/^https?:/.test(p.source_url || '') ? `<a class="btn sm ghost" href="${esc(p.source_url)}" target="_blank" rel="noopener">رابط المصدر</a>` : ''}
        </div>
      </div></div>`;
  }).join('') || empty('لا توجد منتجات.');
}
$('#q').addEventListener('input', drawProducts);
$('#plist').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.copy !== undefined) return copyText(b.dataset.copy);
  if (b.dataset.edit) return edit(b.dataset.edit);
  if (b.dataset.toggle) {
    const p = products.find(x => x.id === b.dataset.toggle);
    const { error } = await sb.from('products').update({ status: p.status === 'published' ? 'hidden' : 'published' }).eq('id', p.id);
    if (error) return toast(error.message);
    loadProducts();
  }
});

/* ---------- النموذج ---------- */
function calcFinal() {
  const p = parseFloat($('#f-price').value) || 0, m = parseFloat($('#f-margin').value) || 0;
  $('#f-final').value = money(Math.round(p * (1 + m / 100) * 100) / 100);
}
['f-price', 'f-margin'].forEach(id => $('#' + id).addEventListener('input', calcFinal));

let fieldsDirty = false;
['f-colors', 'f-sizes'].forEach(id => $('#' + id).addEventListener('input', () => { fieldsDirty = true; }));

function resetForm() {
  editing = null; variants = []; fieldsDirty = false;
  ['f-title', 'f-url', 'f-price', 'f-desc', 'f-images', 'f-colors', 'f-sizes', 'pj', 'imp-html', 'one'].forEach(id => { $('#' + id).value = ''; });
  $('#f-margin').value = 30; $('#f-cat').value = ''; $('#f-status').value = 'draft';
  $('#ftitle').textContent = 'منتج جديد'; $('#tabform').textContent = 'منتج جديد'; $('#del').hidden = true;
  renderVariants(); calcFinal();
}
function genVariants() {
  const cs = split($('#f-colors').value), ss = split($('#f-sizes').value);
  const C = cs.length ? cs : [null], S = ss.length ? ss : [null];
  const old = new Map(variants.map(v => [(v.color || '') + '|' + (v.size || ''), v]));
  variants = [];
  C.forEach(c => S.forEach(s => {
    const o = old.get((c || '') + '|' + (s || ''));
    variants.push({ color: c, size: s, in_stock: o ? o.in_stock : true, price_override: o ? o.price_override : null });
  }));
  fieldsDirty = false;
  renderVariants();
}
function renderVariants() {
  $('#vlist').innerHTML = variants.length ? variants.map((v, i) => `<div class="vrow">
    <span>${esc(v.color || 'بدون لون')} / ${esc(v.size || 'بدون مقاس')}</span>
    <input class="in" type="number" step="0.01" min="0" placeholder="سعر خاص" value="${v.price_override ?? ''}" data-vp="${i}" aria-label="سعر خاص">
    <label class="chk"><input type="checkbox" data-vs="${i}" ${v.in_stock ? 'checked' : ''}> متوفر</label></div>`).join('')
    : '<p class="muted">اكتب الألوان والمقاسات ثم اضغط توليد الخيارات. إذا تركتهما فارغين يُنشأ خيار واحد.</p>';
}
$('#gen').addEventListener('click', genVariants);
$('#vlist').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.vp !== undefined) variants[+t.dataset.vp].price_override = t.value === '' ? null : parseFloat(t.value);
  if (t.dataset.vs !== undefined) variants[+t.dataset.vs].in_stock = t.checked;
});

/* ---------- استقبال رابط مشارَك من تطبيق شي إن/تيمو ---------- */
(function () {
  const q = new URLSearchParams(location.search);
  const shared = q.get('shared_url') || q.get('shared_text') || '';
  if (!shared) return;
  const m = shared.match(/https?:\/\/[^\s"'<>]+/);
  if (!m) return;
  const ready = () => {
    const box = $('#one');
    if (!box) return setTimeout(ready, 200);
    box.value = m[0];
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast('وصل الرابط — اضغط «استخراج وتعبئة»');
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready);
  else ready();
})();

/* ---------- استيراد: خانة واحدة تستقبل رابطًا أو نصًا أو JSON ---------- */

function applyImport(j) {
  if (!j || (!j.title && j.price == null && !(j.images || []).length)) return toast('لم نجد بيانات — جرّب لصق نص الصفحة');
  $('#f-title').value = j.title || '';
  if (j.url || j.source_url) $('#f-url').value = j.url || j.source_url;
  $('#f-price').value = j.price == null ? '' : j.price;
  $('#f-desc').value = j.description || '';
  $('#f-images').value = (j.images || []).join('\n');
  $('#f-colors').value = (j.colors || []).join('، ');
  $('#f-sizes').value = (j.sizes || []).join('، ');
  genVariants();
  const out = new Set(j.soldOut || []);
  variants.forEach(v => { if (v.size && out.has(v.size)) v.in_stock = false; });
  renderVariants(); calcFinal();
  const cur = String(j.currency || '').toUpperCase();
  const bits = [j.title ? 'اسم ✓' : 'اسم ✗', j.price != null ? 'سعر ✓' : 'سعر ✗', (j.images || []).length + ' صورة'];
  if ((j.sizes || []).length) bits.push(j.sizes.length + ' مقاس');
  if ((j.colors || []).length) bits.push(j.colors.length + ' لون');
  toast(bits.join(' · ') + (cur && cur !== 'USD' ? ' — السعر بـ' + cur : ''));
  $('#f-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function previewImport(j) {
  const th = (j.images || []).slice(0, 5).map(u => `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" style="width:64px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">`).join('');
  $('#imp-prev').innerHTML = `<div class="panel" style="margin-top:12px;padding:12px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">${th}</div>
    <div><b>${esc(j.title || 'بدون عنوان')}</b></div>
    <div class="muted">السعر: <bdi>${j.price != null ? esc(j.price) + ' ' + esc(j.currency || '') : '—'}</bdi>${(j.sizes || []).length ? ' · مقاسات: ' + esc(j.sizes.join('، ')) : ''}${(j.colors || []).length ? ' · ألوان: ' + esc(j.colors.join('، ')) : ''}</div>
  </div>`;
}

async function oneGo() {
  const v = $('#one').value.trim();
  const msg = $('#one-msg'), openBox = $('#one-open');
  openBox.hidden = true; msg.textContent = ''; $('#imp-prev').innerHTML = '';
  if (v.length < 10) { msg.textContent = 'الصق رابطًا أو نص الصفحة أولًا.'; return; }

  // JSON ملصوق؟
  if (/^\s*\{/.test(v)) {
    try { const j = JSON.parse(v); previewImport(j); return applyImport(j); }
    catch (e) { msg.textContent = 'هذا يبدو JSON لكنه غير صالح.'; return; }
  }

  const R = Extract.route(v);
  const link = R.url ? { url: R.url, source: R.source } : null;

  // رابط + نص طويل = المستخدم نسخ الصفحة كاملة → نستخرج من النص (أدق وأسرع)
  if (R.kind === 'url+text') {
    const j = Extract.fromText(R.text, R.url);
    if (j.ok) { previewImport(j); applyImport(j); msg.textContent = 'تم الاستخراج من النص ✓'; return; }
  }

  // رابط فقط → نجرب الجلب من الخادم
  if (R.kind === 'url') {
    const dup = products.find(p => p.source_url === link.url);
    if (dup && !editing) return toast('المنتج موجود مسبقًا: ' + dup.code);
    const btn = $('#one-go'); btn.disabled = true; btn.textContent = 'جاري الجلب...';
    msg.textContent = 'نجرب الجلب التلقائي...';
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) throw new Error('سجّل الدخول أولاً');
      const r = await fetch('/.netlify/functions/import-product?url=' + encodeURIComponent(link.url), { headers: { Authorization: 'Bearer ' + session.access_token } });
      const j = await r.json().catch(() => ({}));
      if (j.ok) {
        previewImport(j); applyImport(j);
        msg.textContent = j.partial ? 'جلب جزئي — أكمل الناقص يدويًا.' : 'تم الجلب ✓';
        return;
      }
      // فشل → نطلب خطوة واحدة فقط: انسخ نص الصفحة
      const host = link.source === 'shein' ? 'شي إن' : link.source === 'temu' ? 'تيمو' : 'الموقع';
      msg.innerHTML = '<b style="color:var(--bad)">' + host + ' ما يسمح بالجلب التلقائي.</b> خطوة واحدة فقط:';
      openBox.hidden = false;
      openBox.innerHTML = '<a class="btn sm" href="' + esc(link.url) + '" target="_blank" rel="noopener">افتح المنتج ↗</a>'
        + '<span class="muted" style="display:block;margin-top:8px">في الصفحة: حدّد كل النص (Ctrl+A) ← انسخ (Ctrl+C) ← ارجع هنا والصقه في الخانة ↑ ثم «استخراج وتعبئة».</span>';
      $('#one').value = link.url;
    } catch (e) {
      msg.textContent = e.message || 'فشل الجلب';
    } finally { btn.disabled = false; btn.textContent = 'استخراج وتعبئة'; }
    return;
  }

  // نص فقط → استخراج نصي
  const j = Extract.fromText(v, '');
  if (j.ok) { previewImport(j); applyImport(j); msg.textContent = 'تم الاستخراج من النص ✓ (أضف الصور يدويًا)'; }
  else msg.textContent = 'ما لقينا اسمًا أو سعرًا في النص — جرّب نسخ الصفحة كاملة.';
}

$('#one-go').addEventListener('click', oneGo);
$('#doimport').addEventListener('click', () => {
  let j; try { j = JSON.parse($('#pj').value); } catch (e) { return toast('JSON غير صالح'); }
  previewImport(j); applyImport(j);
});
$('#imp-parse').addEventListener('click', () => {
  const html = $('#imp-html').value;
  if (html.trim().length < 200) return toast('الصق كود الصفحة كاملًا');
  const j = Extract.fromHtml(html, '');
  if (!j.ok) { toast('ما لقينا بيانات منتج في هذا الكود'); return; }
  previewImport(j); applyImport(j);
});

/* ---------- استيراد من CJ (عبر دالة Netlify الآمنة) ---------- */
async function cj(params) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('سجّل الدخول أولاً');
  const r = await fetch('/.netlify/functions/cj?' + new URLSearchParams(params), { headers: { Authorization: 'Bearer ' + session.access_token } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('خطأ ' + r.status));
  return j;
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('تم نسخ الكود: ' + t); }
  catch (e) { window.prompt('انسخ الكود:', t); }
}
const priceText = s => /^[\d.]+$/.test(String(s)) ? money(s) : CONFIG.CURRENCY + s;
async function cjSearch(page) {
  const q = $('#cjq').value.trim(); if (!q) return toast('اكتب كلمة البحث');
  $('#cjres').innerHTML = '<p class="muted">جاري البحث...</p>';
  try {
    const d = await cj({ action: 'search', q, page });
    if (!d.items.length) { $('#cjres').innerHTML = empty('لا توجد نتائج.'); return; }
    $('#cjres').innerHTML = d.items.map(p => `<div class="prow">
      ${p.image ? img(p.image) : '<div class="noimg"></div>'}
      <div><b>${esc(p.name)}</b>
        <div class="muted"><bdi>${esc(priceText(p.price))}</bdi> | المخزون: ${p.stock ?? '؟'}${p.freeShipping ? ' | شحن مجاني' : ''}</div>
        <div class="muted">المصدر: CJ Dropshipping | المورد: ${esc(p.supplier || 'غير معلن')}${p.category ? ' | ' + esc(p.category) : ''}</div>
        <div class="muted">SKU: <bdi dir="ltr">${esc(p.sku || '')}</bdi></div>
        <div class="acts"><button class="btn sm" data-cjpid="${esc(p.id)}" type="button">استيراد</button>
          <button class="btn sm ghost" data-copy="${esc(p.sku || '')}" type="button">نسخ SKU</button></div></div></div>`).join('') +
      `<div class="acts" style="justify-content:center;margin-top:12px">
        <button class="btn sm ghost" data-cjpage="${page - 1}" type="button" ${page <= 1 ? 'disabled' : ''}>السابق</button>
        <span class="muted">صفحة ${page} من ${d.totalPages || 1}</span>
        <button class="btn sm ghost" data-cjpage="${page + 1}" type="button" ${page >= (d.totalPages || 1) ? 'disabled' : ''}>التالي</button></div>`;
  } catch (e) { $('#cjres').innerHTML = empty(e.message); }
}
async function cjImport(pid, btn) {
  if (editing) return toast('أنهِ تعديل المنتج الحالي أولاً');
  btn.disabled = true; const t = btn.textContent; btn.textContent = 'جاري الاستيراد...';
  try {
    const p = await cj({ action: 'product', pid });
    const url = 'cj:' + (p.sku || pid);
    const dup = products.find(x => x.source_url === url);
    if (dup) return toast('هذا المنتج موجود مسبقاً. الكود: ' + dup.code);
    resetForm();
    const margin = parseFloat($('#f-margin').value) || 0, base = p.price;
    $('#f-title').value = p.name || ''; $('#f-url').value = url; $('#f-desc').value = p.description || '';
    $('#f-price').value = base ?? ''; $('#f-images').value = (p.images || []).join('\n');
    variants = (p.variants || []).map(v => ({
      color: v.color, size: v.size, in_stock: v.stock == null ? true : v.stock > 0,
      price_override: (v.price != null && base != null && v.price - base > 0.005) ? Math.round(v.price * (1 + margin / 100) * 100) / 100 : null
    }));
    $('#f-colors').value = [...new Set(variants.map(v => v.color).filter(Boolean))].join('، ');
    $('#f-sizes').value = [...new Set(variants.map(v => v.size).filter(Boolean))].join('، ');
    fieldsDirty = false; renderVariants(); calcFinal();
    toast((p.stockKnown ? 'تم الاستيراد.' : 'تم الاستيراد. المخزون لكل خيار غير مؤكد، تحقق منه بـ CJ.') + ' المصدر: CJ، المورد: ' + (p.supplier || 'غير معلن'));
    $('#f-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (e) { toast(e.message); }
  finally { btn.disabled = false; btn.textContent = t; }
}
$('#cjgo').addEventListener('click', () => cjSearch(1));
$('#cjq').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); cjSearch(1); } });
$('#cjres').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.copy !== undefined) copyText(b.dataset.copy);
  else if (b.dataset.cjpid) cjImport(b.dataset.cjpid, b);
  else if (b.dataset.cjpage) cjSearch(+b.dataset.cjpage);
});

async function edit(id) {
  const { data: p, error } = await sb.from('products')
    .select('*,product_images(url,sort_order),product_variants(color,size,in_stock,price_override)').eq('id', id).single();
  if (error) return toast(error.message);
  resetForm(); editing = id;
  $('#f-title').value = p.title; $('#f-url').value = p.source_url || ''; $('#f-price').value = p.shein_price;
  $('#f-margin').value = p.margin_percent; $('#f-cat').value = p.category_id || ''; $('#f-status').value = p.status;
  $('#f-desc').value = p.description || '';
  $('#f-images').value = p.product_images.sort((a, b) => a.sort_order - b.sort_order).map(i => i.url).join('\n');
  variants = p.product_variants.map(v => ({ color: v.color, size: v.size, in_stock: v.in_stock, price_override: v.price_override }));
  $('#f-colors').value = [...new Set(variants.map(v => v.color).filter(Boolean))].join('، ');
  $('#f-sizes').value = [...new Set(variants.map(v => v.size).filter(Boolean))].join('، ');
  renderVariants(); calcFinal();
  $('#ftitle').textContent = 'تعديل ' + p.code; $('#tabform').textContent = 'تعديل ' + p.code; $('#del').hidden = false;
  tab('form'); window.scrollTo(0, 0);
}

async function save() {
  const title = $('#f-title').value.trim(), price = parseFloat($('#f-price').value);
  if (!title || !(price >= 0)) return toast('الاسم والسعر مطلوبان');
  if (fieldsDirty || !variants.length) genVariants();
  const row = {
    title, source_url: $('#f-url').value.trim() || null, shein_price: price,
    margin_percent: parseFloat($('#f-margin').value) || 0, category_id: $('#f-cat').value || null,
    description: $('#f-desc').value.trim() || null, status: $('#f-status').value
  };
  const btn = $('#save'); btn.disabled = true;
  try {
    const q = editing ? sb.from('products').update(row).eq('id', editing) : sb.from('products').insert(row);
    const { data, error } = await q.select('id,code').single();
    if (error) throw error;
    const id = data.id;
    let r = await sb.from('product_images').delete().eq('product_id', id); if (r.error) throw r.error;
    r = await sb.from('product_variants').delete().eq('product_id', id); if (r.error) throw r.error;
    const imgs = $('#f-images').value.split('\n').map(x => x.trim()).filter(Boolean);
    if (imgs.length) { r = await sb.from('product_images').insert(imgs.map((url, i) => ({ product_id: id, url, sort_order: i }))); if (r.error) throw r.error; }
    r = await sb.from('product_variants').insert(variants.map(v => ({ product_id: id, color: v.color, size: v.size, in_stock: v.in_stock, price_override: v.price_override })));
    if (r.error) throw r.error;
    toast('تم الحفظ. الكود: ' + data.code);
    await loadProducts(); resetForm(); tab('products');
  } catch (e) { toast(e.message || 'تعذر الحفظ'); }
  finally { btn.disabled = false; }
}
$('#save').addEventListener('click', save);
$('#cancel').addEventListener('click', () => { resetForm(); tab('products'); });
$('#del').addEventListener('click', async () => {
  if (!editing || !confirm('حذف المنتج نهائياً؟')) return;
  const { error } = await sb.from('products').delete().eq('id', editing);
  if (error) return toast(error.message);
  await loadProducts(); resetForm(); tab('products');
});
</script>
</body>
