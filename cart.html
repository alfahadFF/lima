<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>السلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#faf0e8">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="شي ان ليما">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top" id="hdr"></header>
<main class="wrap" style="padding-bottom:48px"><div id="cart"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  renderHeader();
  document.title = 'السلة | ' + CONFIG.STORE_NAME;
  const root = $('#cart');
  const cust = { name: '', city: '' };

  function draw() {
    const items = Cart.get();
    if (!items.length) {
      root.innerHTML = empty('السلة فارغة.') + '<p class="center"><a class="btn" href="index.html">تصفح المنتجات</a></p>';
      return;
    }
    root.innerHTML = `<h1 class="h1">السلة</h1>` + items.map((it, i) => `
      <div class="line">
        <a class="ph" href="product.html?c=${encodeURIComponent(it.code)}">${img(it.image, it.title)}</a>
        <div>
          <h3>${esc(it.title)}</h3>
          <div class="muted"><span class="tag">${esc(it.code)}</span> ${esc([it.color, it.size].filter(Boolean).join(' / '))}</div>
          <div class="row">
            <div class="stepper"><button data-i="${i}" data-d="1" aria-label="زيادة">+</button><span>${it.qty}</span><button data-i="${i}" data-d="-1" aria-label="نقصان">−</button></div>
            <b><bdi>${money(it.price * it.qty)}</bdi></b>
          </div>
          <button class="linkbtn" data-rm="${i}">حذف</button>
        </div>
      </div>`).join('') + `
      <div class="sum"><span>الإجمالي</span><bdi>${money(Cart.total())}</bdi></div>
      ${CONFIG.CART_NOTE ? `<p class="muted">${esc(CONFIG.CART_NOTE)}</p>` : ''}
      <div class="panel">
        <div class="field"><label for="cn">الاسم</label><input class="in" id="cn" autocomplete="name" value="${esc(cust.name)}"></div>
        <div class="field"><label for="cc">المدينة</label><input class="in" id="cc" autocomplete="address-level2" value="${esc(cust.city)}"></div>
        <button class="btn wa block" id="send">إرسال الطلب عبر واتساب</button>
        <p class="center"><button class="linkbtn" id="clear">تفريغ السلة</button></p>
      </div>`;
  }

  root.addEventListener('input', e => {
    if (e.target.id === 'cn') cust.name = e.target.value;
    if (e.target.id === 'cc') cust.city = e.target.value;
  });
  root.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.d) { const i = +b.dataset.i; Cart.setQty(i, Cart.get()[i].qty + +b.dataset.d); draw(); }
    else if (b.dataset.rm !== undefined) { Cart.setQty(+b.dataset.rm, 0); draw(); }
    else if (b.id === 'clear') { if (confirm('تفريغ السلة؟')) { Cart.clear(); draw(); } }
    else if (b.id === 'send') {
      if (!cust.name.trim() || !cust.city.trim()) { toast('اكتب الاسم والمدينة أولاً'); return; }
      location.href = buildWhatsAppLink(Cart.get(), { name: cust.name.trim(), city: cust.city.trim() });
    }
  });
  draw();
})();
</script>
</body>
</html>
